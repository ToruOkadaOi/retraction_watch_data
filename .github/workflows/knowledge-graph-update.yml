name: Knowledge Graph Update

on:
  push:
    paths:
      - 'retraction_watch.csv'
    branches:
      - main
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  update-knowledge-graph:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create outputs directory
        run: mkdir -p outputs
      
      - name: Generate Knowledge Graph
        run: |
          echo "Generating Knowledge Graph from retraction_watch.csv..."
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- retraction_watch.csv) python knowledge_graph.py
        continue-on-error: false
      
      - name: Verify outputs
        run: |
          echo "Checking generated files..."
          ls -lh outputs/
          
          if [ -f "outputs/knowledge_graph.json" ]; then
            echo "✓ JSON export created"
            wc -l outputs/knowledge_graph.json
          fi
          
          if [ -f "outputs/knowledge_graph.graphml" ]; then
            echo "✓ GraphML export created"
          fi
          
          if [ -f "outputs/knowledge_graph.rdf" ]; then
            echo "✓ RDF export created"
          fi
          
          if [ -f "outputs/knowledge_graph.png" ]; then
            echo "✓ Visualization created"
          fi
      
      - name: Generate summary
        run: |
          echo "## Knowledge Graph Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Knowledge Graph successfully generated from retraction_watch.csv" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Generated Files" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 knowledge_graph.json" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 knowledge_graph.graphml (for Gephi)" >> $GITHUB_STEP_SUMMARY
          echo "- 🔗 knowledge_graph.rdf" >> $GITHUB_STEP_SUMMARY
          echo "- 🖼️ knowledge_graph.png (visualization)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Timestamp" >> $GITHUB_STEP_SUMMARY
          echo "Generated at: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-graph-outputs
          path: outputs/knowledge_graph.*
          retention-days: 30
      
