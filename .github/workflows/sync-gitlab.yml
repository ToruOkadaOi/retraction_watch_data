name: Sync from GitLab
on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # manual trigger

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history
          lfs: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git lfs install --local
      
      - name: Sync GitLab data files
        id: sync
        run: |
          git remote add gitlab https://gitlab.com/crossref/retraction-watch-data.git
          git fetch gitlab main

          git checkout gitlab/main -- retraction_watch.csv

          latest_date="$(git show -s --format=%cs gitlab/main)"
          grep -q '^This repository contains the latest dataset from Retraction Watch, generated on ' README.md
          sed -i "s/^This repository contains the latest dataset from Retraction Watch, generated on .*/This repository contains the latest dataset from Retraction Watch, generated on ${latest_date}./" README.md

          if git diff --quiet -- README.md retraction_watch.csv; then
            echo "data_changed=false" >> "$GITHUB_OUTPUT"
            echo "No GitLab data changes to sync"
          else
            git add README.md retraction_watch.csv
            git commit -m "Sync from GitLab ${latest_date}"
            echo "data_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.sync.outputs.data_changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        if: steps.sync.outputs.data_changed == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Knowledge Graph
        if: steps.sync.outputs.data_changed == 'true'
        run: |
          echo "Generating Knowledge Graph from synced retraction_watch.csv..."
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- retraction_watch.csv) python knowledge_graph.py

      - name: Commit Knowledge Graph outputs
        if: steps.sync.outputs.data_changed == 'true'
        run: |
          git add outputs/

          if git diff --staged --quiet; then
            echo "No Knowledge Graph output changes to commit"
          else
            git commit -m "Update Knowledge Graph - $(date +'%Y-%m-%d %H:%M:%S UTC')"
          fi

      - name: Push to GitHub
        if: steps.sync.outputs.data_changed == 'true'
        run: |
          git push origin main
