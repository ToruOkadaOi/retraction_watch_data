name: Deploy compact graph to Aura

on:
  workflow_dispatch:
    inputs:
      min_shared_records:
        description: Minimum distinct records for author/institution nodes
        default: '2'
        required: true

permissions:
  contents: read

concurrency:
  group: aura-graph-import
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -m 'not integration'
      - name: Build and validate compact snapshot
        env:
          MIN_SHARED_RECORDS: ${{ inputs.min_shared_records }}
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct -- retraction_watch.csv) python knowledge_graph.py --profile aura --min-shared-records "$MIN_SHARED_RECORDS"
          cat outputs/aura/aura_report.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: aura-compact-graph
          path: outputs/aura/*.json
          if-no-files-found: error
          retention-days: 30
      - name: Import into Aura in bounded transactions
        env:
          NEO4J_URI: ${{ secrets.AURA_NEO4J_URI }}
          NEO4J_USER: ${{ secrets.AURA_NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.AURA_NEO4J_PASSWORD }}
        run: |
          test -n "$NEO4J_URI"
          test -n "$NEO4J_USER"
          test -n "$NEO4J_PASSWORD"
          python neo4j_integration.py --json outputs/aura/knowledge_graph.json --mode aura
