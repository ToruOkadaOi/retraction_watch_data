name: Code CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/regression-only-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p regression-only-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          TEST_NEO4J_URI: bolt://localhost:7687
          TEST_NEO4J_PASSWORD: regression-only-password
      - name: Validate full-dataset compact artifact
        if: matrix.python-version == '3.11'
        run: |
          python knowledge_graph.py --profile aura
          python -c "import json; from graph_schema import validate_snapshot; validate_snapshot(json.load(open('outputs/aura/knowledge_graph.json')))"
